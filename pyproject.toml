[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lorehopqa"
version = "1.0.0"
description = "Validation experiments for the LoreHopQA multi-hop RAG benchmark."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "LoreHopQA contributors" }]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "orjson>=3.10,<4",
]

# vLLM is intentionally absent from [project.dependencies]: readers run inside a Singularity
# image that supplies its own CUDA-matched vLLM/PyTorch stack, which must not be resolved
# against this environment. The analysis scripts need none of it.

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
